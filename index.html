  <script type="text/babel">
    const { useState, useCallback, useRef, useEffect } = React;

    const TRANSLATIONS = {

      }
    };

    const getNodeTypes = (lang) => {
      const t = TRANSLATIONS[lang];
      return [
        { type: 'terminal', label: lang === 'zh' ? '起點 / 終點' : 'Start / End', iconClass: 'fa-play', color: 'bg-red-50 border-red-500 text-red-900', defaultDesc: lang === 'zh' ? '流程的開始或結束點' : 'Start or end of process', shapeClass: 'rounded-full', contentClass: '' },
        { type: 'process', label: lang === 'zh' ? '處理程序' : 'Process', iconClass: 'fa-gear', color: 'bg-blue-50 border-blue-500 text-blue-900', defaultDesc: lang === 'zh' ? '一個動作或運算' : 'An action or operation', shapeClass: 'rounded-md', contentClass: '' },
        { type: 'decision', label: lang === 'zh' ? '條件判斷' : 'Decision', iconClass: 'fa-diamond', color: 'bg-orange-50 border-orange-500 text-orange-900', defaultDesc: lang === 'zh' ? '判斷條件，產生分支' : 'Decision point', shapeClass: 'rounded-tl-[1.5rem] rounded-br-[1.5rem] rounded-tr-md rounded-bl-md', contentClass: '' },
        { type: 'io', label: lang === 'zh' ? '資料 / IO' : 'Data / I/O', iconClass: 'fa-database', color: 'bg-green-50 border-green-500 text-green-900', defaultDesc: lang === 'zh' ? '資料的輸入或輸出' : 'Input or output data', shapeClass: '-skew-x-12 rounded-sm', contentClass: 'skew-x-12' },
        { type: 'page', label: t.page || '頁面', iconClass: 'fa-file-lines', color: 'bg-white border-gray-400 text-gray-800', defaultDesc: lang === 'zh' ? 'APP或網站的獨立頁面' : 'A single screen or page', shapeClass: 'rounded-sm', contentClass: '' },
        { type: 'group', label: t.group || '模組', iconClass: 'fa-object-group', color: 'bg-gray-50 border-gray-400 border-dashed text-gray-600', defaultDesc: lang === 'zh' ? '邏輯相近的功能區塊' : 'Logical group of features', shapeClass: 'rounded-xl', contentClass: '' },
        { type: 'sticky', label: t.sticky || '便利貼', iconClass: 'fa-note-sticky', color: 'bg-yellow-200 border-yellow-300 text-yellow-900', defaultDesc: lang === 'zh' ? '備註說明或待辦事項' : 'Notes or to-dos', shapeClass: 'rounded-none shadow-md', contentClass: '' }
      ];
    };

    const NODE_WIDTH = 180;
    const NODE_HEIGHT = 60;

    const getBezierPath = (startX, startY, endX, endY, isBackward = false) => {
      const deltaY = Math.abs(endY - startY);
      const controlOffset = Math.max(deltaY / 2, 40);
      const cp1Y = isBackward ? startY - controlOffset : startY + controlOffset;
      const cp2Y = isBackward ? endY + controlOffset : endY - controlOffset;
      return `M ${startX},${startY} C ${startX},${cp1Y} ${endX},${cp2Y} ${endX},${endY}`;
    };

    const getStepPath = (startX, startY, endX, endY, isBackward = false, offsetY = 0) => {
      if (isBackward) return getBezierPath(startX, startY, endX, endY, true); 
      
      let midY = startY + 40 + offsetY;
      if (midY > endY - 20) midY = startY + (endY - startY) / 2;
      
      const r = 12;
      if (Math.abs(startX - endX) < r * 2) {
         return `M ${startX},${startY} L ${endX},${endY}`;
      }
      const dirX = endX > startX ? 1 : -1;
      return `M ${startX},${startY} 
              L ${startX},${midY - r}
              Q ${startX},${midY} ${startX + r * dirX},${midY}
              L ${endX - r * dirX},${midY}
              Q ${endX},${midY} ${endX},${midY + r}
              L ${endX},${endY}`;
    };

    function AppArchitect() {
      const urlParams = new URLSearchParams(window.location.search);
      const initialRoom = urlParams.get('room') || 'default_room';
      const [currentRoom, setCurrentRoom] = useState(initialRoom);

      const syncToCloud = useCallback((newNodes, newEdges) => {
        const user = firebase.auth().currentUser;
        if (user) {
          firebase.database().ref(`architect_rooms/${currentRoom}`).set({
            nodes: newNodes || [],
            edges: newEdges || []
          }).catch(err => console.error("同步失敗:", err));
        }
      }, [currentRoom]);

      useEffect(() => {
        if (!firebase.apps.length) {
          firebase.initializeApp({
            apiKey: "AIzaSyA5ZVJ1-AF9AMYJQJxCAveKgjb0ZvaJC3k",
            authDomain: "device-streaming-3669a5cf.firebaseapp.com",
            databaseURL: "https://device-streaming-3669a5cf-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "device-streaming-3669a5cf",
          });
        }
        
        firebase.auth().signInAnonymously()
          .then(() => {
            const db = firebase.database();
            const roomRef = db.ref(`architect_rooms/${currentRoom}`);
            roomRef.on('value', (snapshot) => {
              const data = snapshot.val();
              if (data) {
                setNodes(prev => JSON.stringify(prev) !== JSON.stringify(data.nodes || []) ? (data.nodes || []) : prev);
                setEdges(prev => JSON.stringify(prev) !== JSON.stringify(data.edges || []) ? (data.edges || []) : prev);
              } else {
                setNodes([]); setEdges([]);
              }
            });
            return () => roomRef.off();
          })
          .catch((error) => console.error("登入失敗:", error));
      }, [currentRoom]);

      const [lang, setLang] = useState('zh');
      const [nodes, setNodes] = useState([]);
      const [edges, setEdges] = useState([]);
      const [mode, setMode] = useState('edit');
      const [layoutMode, setLayoutMode] = useState('tree');
      
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const [contextMenu, setContextMenu] = useState(null);
      const [clipboard, setClipboard] = useState(null); 
      const [toastMessage, setToastMessage] = useState(null);
      
      const [transform, setTransform] = useState({ x: 0, y: 0, scale: 1 });
      const canvasRef = useRef(null);
      const fileInputRef = useRef(null);

      const [isPanning, setIsPanning] = useState(false);
      const [panStart, setPanStart] = useState({ x: 0, y: 0 });
      const [draggingNode, setDraggingNode] = useState(null);
      const [drawingEdge, setDrawingEdge] = useState(null);

      const t = TRANSLATIONS[lang];
      const NODE_TYPES = getNodeTypes(lang);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const handleChangeRoom = () => {
        const newRoom = prompt(lang === 'zh' ? '請輸入要加入或建立的房間名稱 (英文或數字)：' : 'Enter room name:', currentRoom);
        if (newRoom && newRoom.trim() !== '' && newRoom !== currentRoom) {
           window.location.href = `?room=${newRoom.trim()}`;
        }
      };

      const copyRoomLink = () => {
        const url = new URL(window.location.href);
        url.searchParams.set('room', currentRoom);
        navigator.clipboard.writeText(url.toString());
        showToast(lang === 'zh' ? '已複製房間連結！' : 'Room link copied!');
      };

      const getCanvasCoords = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left - transform.x) / transform.scale,
          y: (e.clientY - rect.top - transform.y) / transform.scale
        };
      };

      const onCanvasMouseDown = (e) => {
        if (e.button !== 0) return;
        if (e.target.closest('.canvas-element') === null && e.target.closest('.context-menu') === null) {
          setSelectedNodeId(null);
          setContextMenu(null);
          setIsPanning(true);
          setPanStart({ x: e.clientX - transform.x, y: e.clientY - transform.y });
        }
      };

      const onCanvasMouseMove = (e) => {
        if (isPanning) {
          setTransform(prev => ({ ...prev, x: e.clientX - panStart.x, y: e.clientY - panStart.y }));
        } else if (draggingNode && mode === 'edit') {
          const dx = (e.clientX - draggingNode.mouseX) / transform.scale;
          const dy = (e.clientY - draggingNode.mouseY) / transform.scale;
          setNodes(nds => nds.map(n => 
            n.id === draggingNode.id 
              ? { ...n, x: draggingNode.startX + dx, y: draggingNode.startY + dy }
              : n
          ));
        } else if (drawingEdge && mode === 'edit') {
          const coords = getCanvasCoords(e);
          setDrawingEdge(prev => ({ ...prev, currentX: coords.x, currentY: coords.y }));
        }
      };

      const onCanvasMouseUp = () => {
        setIsPanning(false);
        if (draggingNode) syncToCloud(nodes, edges);
        setDraggingNode(null);
        setDrawingEdge(null);
      };

      const onCanvasWheel = (e) => {
        if (e.altKey) {
          e.preventDefault();
          const scaleAdjustment = e.deltaY > 0 ? 0.9 : 1.1;
          let newScale = transform.scale * scaleAdjustment;
          newScale = Math.min(Math.max(0.2, newScale), 3);
          const rect = canvasRef.current.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;
          const newX = mouseX - (mouseX - transform.x) * (newScale / transform.scale);
          const newY = mouseY - (mouseY - transform.y) * (newScale / transform.scale);
          setTransform({ x: newX, y: newY, scale: newScale });
        } else {
          setTransform(prev => ({ ...prev, x: prev.x - e.deltaX, y: prev.y - e.deltaY }));
        }
      };

      const handleAutoLayout = () => {
        if (nodes.length === 0) return;
        if (!window.dagre) return;

        const g = new dagre.graphlib.Graph();
        g.setGraph({ rankdir: 'TB', nodesep: 60, ranksep: 100, marginx: 50, marginy: 50 });
        g.setDefaultEdgeLabel(() => ({}));

        nodes.forEach(node => g.setNode(node.id, { width: NODE_WIDTH, height: NODE_HEIGHT }));
        edges.forEach(edge => g.setEdge(edge.source, edge.target));

        dagre.layout(g);

        const newNodes = nodes.map(node => {
          const nodeWithPos = g.node(node.id);
          return {
            ...node,
            x: nodeWithPos.x - NODE_WIDTH / 2 + 300, 
            y: nodeWithPos.y - NODE_HEIGHT / 2 + 100
          };
        });

        setNodes(newNodes);
        setTransform({ x: 0, y: 0, scale: 1 });
        showToast(t.layoutOrganized);
        syncToCloud(newNodes, edges);
      };

      const togglePortal = (nodeId) => {
        const node = nodes.find(n => n.id === nodeId);
        if (!node) return;

        const isCurrentlyPortal = node.data.isPortalOut;

        if (!isCurrentlyPortal) {
          const cloneId = `portal_in_${nodeId}`;
          const cloneNode = {
            id: cloneId,
            x: node.x + 300, 
            y: node.y,
            data: {
              ...node.data,
              isPortalIn: true,
              portalSource: nodeId,
              label: `[接續] ${node.data.label}`
            }
          };
          
          const newNodes = [...nodes.map(n => n.id === nodeId ? { ...n, data: { ...n.data, isPortalOut: true } } : n), cloneNode];
          const newEdges = edges.map(e => e.source === nodeId ? { ...e, source: cloneId } : e);
          
          setNodes(newNodes);
          setEdges(newEdges);
          syncToCloud(newNodes, newEdges);
          showToast('傳送門已建立！建議點擊「一鍵整理」重新排版。');
        } else {
          const cloneId = `portal_in_${nodeId}`;
          const newNodes = nodes.map(n => n.id === nodeId ? { ...n, data: { ...n.data, isPortalOut: false } } : n).filter(n => n.id !== cloneId);
          const newEdges = edges.map(e => e.source === cloneId ? { ...e, source: nodeId } : e);
          
          setNodes(newNodes);
          setEdges(newEdges);
          syncToCloud(newNodes, newEdges);
          showToast('傳送門已關閉，節點已重新接合！');
        }
      };

      const onCanvasContextMenu = (e) => {
        e.preventDefault();
        if (mode === 'view') return;
        const rect = canvasRef.current.getBoundingClientRect();
        const coords = getCanvasCoords(e);
        setContextMenu({ type: 'canvas', top: e.clientY - rect.top, left: e.clientX - rect.left, dropX: coords.x, dropY: coords.y });
      };

      const onNodeMouseDown = (e, node) => {
        if (e.button !== 0 || mode === 'view') {
          if (mode === 'view') setSelectedNodeId(node.id);
          return;
        }
        e.stopPropagation();
        setSelectedNodeId(node.id);
        setContextMenu(null);
        setDraggingNode({ id: node.id, startX: node.x, startY: node.y, mouseX: e.clientX, mouseY: e.clientY });
      };

      const onNodeContextMenu = (e, node) => {
        e.preventDefault();
        e.stopPropagation();
        if (mode === 'view') return;
        const rect = canvasRef.current.getBoundingClientRect();
        setContextMenu({ type: 'node', id: node.id, top: e.clientY - rect.top, left: e.clientX - rect.left });
      };

      const onEdgeContextMenu = (e, edge) => {
        e.preventDefault();
        e.stopPropagation();
        if (mode === 'view') return;
        const rect = canvasRef.current.getBoundingClientRect();
        setContextMenu({ type: 'edge', id: edge.id, top: e.clientY - rect.top, left: e.clientX - rect.left });
      };

      const handleContextMenuAction = (action) => {
        if (!contextMenu) return;
        if (action === 'delete') {
          if (contextMenu.type === 'node') {
            const newNodes = nodes.filter(node => node.id !== contextMenu.id);
            const newEdges = edges.filter(edge => edge.source !== contextMenu.id && edge.target !== contextMenu.id);
            setNodes(newNodes); setEdges(newEdges);
            if (selectedNodeId === contextMenu.id) setSelectedNodeId(null);
            syncToCloud(newNodes, newEdges);
          } else if (contextMenu.type === 'edge') {
            const newEdges = edges.filter(edge => edge.id !== contextMenu.id);
            setEdges(newEdges); syncToCloud(nodes, newEdges);
          }
        } 
        else if (action === 'copy' || action === 'cut') {
          const targetNode = nodes.find(n => n.id === contextMenu.id);
          if (targetNode) {
            setClipboard({ action, node: JSON.parse(JSON.stringify(targetNode)) });
            if (action === 'cut') {
              const newNodes = nodes.filter(node => node.id !== contextMenu.id);
              const newEdges = edges.filter(edge => edge.source !== contextMenu.id && edge.target !== contextMenu.id);
              setNodes(newNodes); setEdges(newEdges);
              if (selectedNodeId === contextMenu.id) setSelectedNodeId(null);
              syncToCloud(newNodes, newEdges);
            }
          }
        } 
        else if (action === 'paste') {
          if (!clipboard) return;
          const newNode = { ...clipboard.node, id: `node_${Date.now()}`, x: contextMenu.dropX - NODE_WIDTH / 2, y: contextMenu.dropY - NODE_HEIGHT / 2 };
          const newNodes = [...nodes, newNode];
          setNodes(newNodes); syncToCloud(newNodes, edges);
          if (clipboard.action === 'cut') setClipboard(null); 
        }
        setContextMenu(null);
      };

      const onPortMouseDown = (e, nodeId, position) => {
        e.stopPropagation();
        if (mode === 'view') return;
        const node = nodes.find(n => n.id === nodeId);
        const startX = node.x + NODE_WIDTH / 2;
        const startY = position === 'top' ? node.y - 15 : node.y + NODE_HEIGHT + 15;
        setDrawingEdge({ source: nodeId, startX, startY, currentX: startX, currentY: startY });
      };

      const onPortMouseUp = (e, nodeId, position) => {
        if (!drawingEdge) return;
        e.stopPropagation();
        if (mode === 'view') {
          setDrawingEdge(null);
          return;
        }
        
        if (drawingEdge.source !== nodeId) {
          const edgeExists = edges.some(edge => edge.source === drawingEdge.source && edge.target === nodeId);
          if (!edgeExists) {
            const sourceNode = nodes.find(n => n.id === drawingEdge.source);
            const parentColor = sourceNode?.data?.color; 

            const newEdge = { id: `edge_${Date.now()}`, source: drawingEdge.source, target: nodeId, color: parentColor };
            
            let newNodes = nodes;
            if (parentColor) {
              newNodes = nodes.map(n => n.id === nodeId ? { ...n, data: { ...n.data, color: parentColor } } : n);
              setNodes(newNodes);
            }

            const newEdges = [...edges, newEdge];
            setEdges(newEdges);
            syncToCloud(newNodes, newEdges);
          }
        }
        setDrawingEdge(null);
      };

      const onDragStartSidebar = (event, nodeTypeObj) => {
        event.dataTransfer.setData('application/node', JSON.stringify(nodeTypeObj));
        event.dataTransfer.effectAllowed = 'move';
      };

      const onCanvasDrop = (e) => {
        e.preventDefault();
        if (mode === 'view') return;
        const typeDataString = e.dataTransfer.getData('application/node');
        if (!typeDataString) return;
        const typeData = JSON.parse(typeDataString);
        const coords = getCanvasCoords(e);
        const newNode = {
          id: `node_${Date.now()}`,
          x: coords.x - NODE_WIDTH / 2,
          y: coords.y - NODE_HEIGHT / 2,
          data: { label: `${t.new} ${typeData.label}`, description: typeData.defaultDesc, nodeType: typeData.type }
        };
        const newNodes = [...nodes, newNode];
        setNodes(newNodes);
        syncToCloud(newNodes, edges);
      };

      const updateNodeData = (id, field, value) => {
        const newNodes = nodes.map(node => node.id === id ? { ...node, data: { ...node.data, [field]: value } } : node);
        setNodes(newNodes); syncToCloud(newNodes, edges);
      };

      const updateEdgeLabel = (id, label) => {
        const newEdges = edges.map(edge => edge.id === id ? { ...edge, label } : edge);
        setEdges(newEdges); syncToCloud(nodes, newEdges);
      };

      const applyColorToBranch = (startId, colorToApply) => {
        if(!colorToApply) return;
        const nodesToColor = new Set([startId]);
        const edgesToColor = new Set();
        const queue = [startId];
        
        while(queue.length > 0) {
          const curr = queue.shift();
          edges.forEach(e => {
            if (e.source === curr) {
              edgesToColor.add(e.id);
              if (!nodesToColor.has(e.target)) {
                nodesToColor.add(e.target);
                queue.push(e.target);
              }
            }
          });
        }
        
        const newNodes = nodes.map(n => nodesToColor.has(n.id) ? { ...n, data: { ...n.data, color: colorToApply } } : n);
        const newEdges = edges.map(e => edgesToColor.has(e.id) ? { ...e, color: colorToApply } : e);
        
        setNodes(newNodes); setEdges(newEdges); syncToCloud(newNodes, newEdges);
        showToast(lang === 'zh' ? '分支顏色已同步更新！' : 'Branch colors updated!');
      };

      const handleExport = () => {
        const data = { nodes, edges };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = 'ia-user-flow-project.json';
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        showToast(t.exportSuccess);
      };

      const handleExportImage = () => {
        if (!canvasRef.current || nodes.length === 0) {
          showToast(lang === 'zh' ? '畫布是空的，沒東西可以匯出啦！' : 'Canvas is empty!');
          return;
        }
        showToast(lang === 'zh' ? '圖片生成中，請稍候...' : 'Generating image...');
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        nodes.forEach(n => {
          if (n.x < minX) minX = n.x;
          if (n.y < minY) minY = n.y;
          if (n.x + NODE_WIDTH > maxX) maxX = n.x + NODE_WIDTH;
          if (n.y + NODE_HEIGHT > maxY) maxY = n.y + NODE_HEIGHT;
        });

        const padding = 100;
        const exportWidth = (maxX + padding) - (minX - padding);
        const exportHeight = (maxY + padding) - (minY - padding);

        const targetEl = canvasRef.current.querySelector('.origin-top-left');

        htmlToImage.toPng(targetEl, {
          backgroundColor: '#fafafa',
          width: exportWidth,
          height: exportHeight,
          pixelRatio: 2,
          style: {
            transform: `translate(${-(minX - padding)}px, ${-(minY - padding)}px) scale(1)`,
            transformOrigin: 'top left'
          }
        }).then((url) => {
          const link = document.createElement('a');
          link.download = 'app-architecture.png';
          link.href = url;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast(lang === 'zh' ? '圖片匯出成功！' : 'Image exported successfully!');
        }).catch((error) => {
          console.error("截圖失敗：", error);
          showToast(lang === 'zh' ? '圖片匯出發生錯誤' : 'Failed to export image');
        });
      };

      const handleImport = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (parsed.nodes && parsed.edges) {
              setNodes(parsed.nodes);
              setEdges(parsed.edges);
              setTransform({ x: 0, y: 0, scale: 1 });
              showToast(t.importSuccess);
              syncToCloud(parsed.nodes, parsed.edges);
            } else {
              showToast(t.importInvalid);
            }
          } catch (err) {
            showToast(t.importFailed);
          }
        };
        reader.readAsText(file);
        event.target.value = ''; 
      };

      const selectedNode = nodes.find(n => n.id === selectedNodeId);

      return (
        <div className="flex flex-col h-screen w-full bg-gray-50 text-gray-800 font-sans overflow-hidden">
          
          <header className="flex items-center justify-between px-6 py-3 bg-white border-b border-gray-200 shadow-sm z-20">
            <div className="flex items-center space-x-3">
              <div className="p-2 bg-blue-600 text-white rounded-lg flex items-center justify-center w-8 h-8">
                <i className="fa-solid fa-sitemap"></i>
              </div>
              <h1 className="text-xl font-extrabold text-gray-800 tracking-tight">{t.title}</h1>
            </div>

            <div className="flex items-center space-x-4">
              <div className="flex items-center bg-blue-50 text-blue-700 px-3 py-1.5 rounded-lg border border-blue-200 shadow-inner">
                <span className="text-sm font-bold mr-3 tracking-wide">
                  <i className="fa-solid fa-house-user mr-1.5"></i>
                  {currentRoom}
                </span>
                <div className="w-px h-4 bg-blue-200 mx-2"></div>
                <button onClick={copyRoomLink} title={lang === 'zh' ? '複製房間連結' : 'Copy Room Link'} className="w-6 h-6 flex items-center justify-center hover:bg-blue-200 rounded transition-colors mr-1">
                  <i className="fa-solid fa-link text-xs"></i>
                </button>
                <button onClick={handleChangeRoom} title={lang === 'zh' ? '切換房間' : 'Change Room'} className="w-6 h-6 flex items-center justify-center hover:bg-blue-200 rounded transition-colors">
                  <i className="fa-solid fa-door-open text-xs"></i>
                </button>
              </div>
              <div className="w-px h-6 bg-gray-300 mx-2"></div>
              
              <button
                onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')}
                className="px-3 py-1 text-sm font-bold text-gray-500 hover:text-gray-800 transition-colors bg-gray-100 rounded-md border border-gray-200"
              >
                {lang === 'zh' ? 'EN' : '中文'}
              </button>
              <div className="w-px h-6 bg-gray-300 mx-2"></div>

              <div className="flex bg-gray-100 p-1 rounded-lg border border-gray-200">
                <button
                  onClick={() => setMode('edit')}
                  className={`flex items-center px-4 py-1.5 rounded-md text-sm font-medium transition-all ${mode === 'edit' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                >
                  <i className="fa-solid fa-pen mr-2"></i> {t.edit}
                </button>
                <button
                  onClick={() => setMode('view')}
                  className={`flex items-center px-4 py-1.5 rounded-md text-sm font-medium transition-all ${mode === 'view' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}
                >
                  <i className="fa-solid fa-eye mr-2"></i> {t.view}
                </button>
              </div>

              <div className="w-px h-6 bg-gray-300 mx-2"></div>

              <button 
                onClick={handleAutoLayout} 
                className="flex items-center px-3 py-1.5 text-sm font-medium text-white bg-emerald-500 rounded-lg hover:bg-emerald-600 transition-colors shadow-sm"
              >
                <i className="fa-solid fa-magic mr-2"></i> {t.autoLayout}
              </button>

              <button onClick={handleExport} className="flex items-center px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                <i className="fa-solid fa-file-code mr-2"></i> {lang === 'zh' ? '匯出 JSON' : 'Export JSON'}
              </button>
              <button onClick={handleExportImage} className="flex items-center px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                <i className="fa-solid fa-image mr-2"></i> {lang === 'zh' ? '匯出圖片' : 'Export Image'}
              </button>
              <button onClick={() => fileInputRef.current?.click()} className="flex items-center px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                <i className="fa-solid fa-upload mr-2"></i> {t.import}
              </button>
              <input type="file" ref={fileInputRef} onChange={handleImport} accept=".json" className="hidden" />
            </div>
          </header>

          <div className="flex flex-1 overflow-hidden relative">
            
            {mode === 'edit' && (
              <aside className="w-64 bg-white border-r border-gray-200 p-4 flex flex-col z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
                <h2 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4 flex items-center"><i className="fa-solid fa-cubes mr-2"></i> {t.components}</h2>
                <div className="space-y-3">
                  {NODE_TYPES.map((node) => (
                    <div key={node.type} draggable onDragStart={(e) => onDragStartSidebar(e, node)} className={`flex items-center p-3 rounded-lg border cursor-grab hover:-translate-y-0.5 transition-transform ${node.color}`}>
                      <i className={`fa-solid ${node.iconClass} mr-3 opacity-70 w-4 text-center`}></i>
                      <span className="font-semibold text-sm">{node.label}</span>
                    </div>
                  ))}
                </div>
              </aside>
            )}

            <main className="flex-1 relative bg-[#fafafa] overflow-hidden" ref={canvasRef} onMouseDown={onCanvasMouseDown} onMouseMove={onCanvasMouseMove} onMouseUp={onCanvasMouseUp} onMouseLeave={onCanvasMouseUp} onWheel={onCanvasWheel} onDragOver={(e) => e.preventDefault()} onDrop={onCanvasDrop} onContextMenu={onCanvasContextMenu} style={{ backgroundImage: 'radial-gradient(#e2e8f0 1px, transparent 1px)', backgroundSize: `${20 * transform.scale}px ${20 * transform.scale}px`, backgroundPosition: `${transform.x}px ${transform.y}px` }}>
              <div className="absolute origin-top-left will-change-transform" style={{ transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`, width: '100%', height: '100%' }}>
                
                <svg className="absolute top-0 left-0 w-full h-full pointer-events-none overflow-visible">
                  {edges.map(edge => {
                    const sourceNode = nodes.find(n => n.id === edge.source);
                    const targetNode = nodes.find(n => n.id === edge.target);
                    if (!sourceNode || !targetNode) return null;
                    const isBackward = sourceNode.y > targetNode.y;
                    const startX = sourceNode.x + NODE_WIDTH / 2;
                    const startY = sourceNode.y + NODE_HEIGHT + 15;
                    const endX = targetNode.x + NODE_WIDTH / 2;
                    const endY = targetNode.y - 15;

                    const siblingEdges = edges.filter(e => e.source === edge.source);
                    const siblingIndex = siblingEdges.findIndex(e => e.id === edge.id);
                    const totalSiblings = siblingEdges.length;
                    const offsetY = totalSiblings > 1 ? (siblingIndex - (totalSiblings - 1) / 2) * 12 : 0;

                    const isLongDistance = Math.abs(targetNode.y - sourceNode.y) > (NODE_HEIGHT + 150);
                    const strokeColor = edge.color ? edge.color : (isLongDistance ? "#cbd5e1" : "#94a3b8");
                    const strokeWidth = isLongDistance ? "2" : "3";
                    const strokeDash = isLongDistance ? "6,6" : "none";

                    return (
                      <g key={edge.id}>
                        <path d={layoutMode === 'tree' ? getStepPath(startX, startY, endX, endY, isBackward, offsetY) : getBezierPath(startX, startY, endX, endY, isBackward)} fill="none" stroke={strokeColor} strokeWidth={strokeWidth} strokeDasharray={strokeDash} markerEnd={`url(#arrow-${edge.id})`} className="transition-all duration-300 pointer-events-auto cursor-pointer hover:stroke-blue-400" onContextMenu={(e) => onEdgeContextMenu(e, edge)} />
                        <defs><marker id={`arrow-${edge.id}`} viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill={strokeColor} /></marker></defs>
                      </g>
                    );
                  })}
                </svg>

                {nodes.map(node => {
                  const nodeDef = NODE_TYPES.find(n => n.type === node.data.nodeType) || NODE_TYPES[0];
                  const isSelected = selectedNodeId === node.id;
                  const customColor = node.data.color;
                  const customStyle = customColor ? { borderColor: customColor, backgroundColor: `${customColor}1A` } : {};
                  
                  const isPortalOut = node.data.isPortalOut;
                  const isPortalIn = node.data.isPortalIn;
                  
                  return (
                    <div key={node.id} className={`canvas-element absolute group ${mode === 'edit' ? 'cursor-grab active:cursor-grabbing' : 'cursor-pointer'} transition-shadow`} style={{ left: node.x, top: node.y, width: NODE_WIDTH, height: NODE_HEIGHT }} onMouseDown={(e) => onNodeMouseDown(e, node)} onContextMenu={(e) => onNodeContextMenu(e, node)}>
                      <div className={`absolute inset-0 border-2 shadow-sm transition-all ${!customColor ? nodeDef.color : ''} ${!customColor ? 'bg-white' : ''} ${nodeDef.shapeClass || 'rounded-xl'} ${isSelected ? 'ring-4 ring-opacity-50 ring-blue-400 scale-105 shadow-md' : ''} ${isPortalIn || isPortalOut ? 'border-dashed border-[3px]' : ''}`} style={customStyle} />
                      <div 
                        className={`absolute -top-3 left-1/2 -translate-x-1/2 w-4 h-4 bg-gray-300 border-2 border-white rounded-full ${mode === 'edit' ? 'hover:bg-blue-500 hover:scale-125 cursor-crosshair' : 'hidden'} transition-all z-20`}
                        onMouseDown={(e) => onPortMouseDown(e, node.id, 'top')}
                        onMouseUp={(e) => onPortMouseUp(e, node.id, 'top')}
                      />
                      <div className={`absolute inset-0 flex items-center justify-center px-4 pointer-events-none ${nodeDef.contentClass || ''}`}>
                        <div className={`flex items-center space-x-2 ${isSelected ? 'scale-105' : ''} transition-transform`}>
                          {isPortalIn ? (
                            <i className="fa-solid fa-door-open opacity-80 text-purple-500 w-4 text-center"></i>
                          ) : isPortalOut ? (
                            <i className="fa-solid fa-person-through-window opacity-80 text-purple-500 w-4 text-center"></i>
                          ) : (
                            <i className={`fa-solid ${nodeDef.iconClass} opacity-70 w-4 text-center`} style={customColor ? { color: customColor } : {}}></i>
                          )}
                          <div className="font-bold text-sm truncate max-w-[120px]" style={customColor ? { color: customColor } : {}}>{node.data.label}</div>
                        </div>
                      </div>

                      {!isPortalIn && (
                        <div className={`absolute -bottom-3 left-1/2 -translate-x-1/2 w-4 h-4 bg-gray-300 border-2 border-white rounded-full ${mode === 'edit' ? 'hover:bg-blue-500 hover:scale-125 cursor-crosshair' : 'hidden'} transition-all z-20`} onMouseDown={(e) => onPortMouseDown(e, node.id, 'bottom')} onMouseUp={(e) => onPortMouseUp(e, node.id, 'bottom')} />
                      )}
                    </div>
                  );
                })}
              </div>
              {contextMenu && mode === 'edit' && (
                <div 
                  className="context-menu absolute bg-white border border-gray-200 rounded-lg shadow-xl py-1 z-50 w-40 overflow-hidden"
                  style={{ top: contextMenu.top, left: contextMenu.left }}
                  onMouseDown={(e) => e.stopPropagation()}
                  onContextMenu={(e) => e.preventDefault()}
                >
                  {contextMenu.type === 'canvas' && (
                    <button
                      onMouseDown={(e) => { e.stopPropagation(); handleContextMenuAction('paste'); }}
                      disabled={!clipboard}
                      className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center transition-colors disabled:opacity-40 disabled:hover:bg-white disabled:cursor-not-allowed"
                    >
                      <i className="fa-solid fa-paste mr-2"></i> {t.paste}
                    </button>
                  )}
                  
                  {contextMenu.type === 'node' && (
                    <>
                      <button
                        onMouseDown={(e) => { e.stopPropagation(); handleContextMenuAction('copy'); }}
                        className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center transition-colors"
                      >
                        <i className="fa-solid fa-copy mr-2"></i> {t.copy}
                      </button>
                      <button
                        onMouseDown={(e) => { e.stopPropagation(); handleContextMenuAction('cut'); }}
                        className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center transition-colors"
                      >
                        <i className="fa-solid fa-cut mr-2"></i> {t.cut}
                      </button>
                      <div className="border-t border-gray-100 my-1"></div>
                    </>
                  )}

                  {(contextMenu.type === 'node' || contextMenu.type === 'edge') && (
                    <button
                      onMouseDown={(e) => { e.stopPropagation(); handleContextMenuAction('delete'); }}
                      className="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center transition-colors"
                    >
                      <i className="fa-solid fa-trash mr-2"></i> {t.delete}
                    </button>
                  )}
                </div>
              )}
            </main>

            <aside className={`w-80 bg-white border-l border-gray-200 p-6 flex flex-col z-20 shadow-[-4px_0_24px_rgba(0,0,0,0.02)] transition-transform duration-300 absolute right-0 h-full ${selectedNode ? 'translate-x-0' : 'translate-x-full'}`}>
              {selectedNode && (
                <>
                  <div className="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
                    <h2 className="text-sm font-bold text-gray-800 uppercase tracking-wider flex items-center"><i className="fa-solid fa-gear mr-2 text-blue-500"></i> {t.properties}</h2>
                    <button onClick={() => setSelectedNodeId(null)} className="p-1 text-gray-400 hover:text-gray-600 rounded-md hover:bg-gray-100 transition-colors"><i className="fa-solid fa-xmark"></i></button>
                  </div>

                  <div className="space-y-5">
                    <div>
                      <label className="block text-xs font-semibold text-gray-500 mb-1.5 uppercase">{t.nodeLabel}</label>
                      <input type="text" value={selectedNode.data.label} onChange={(e) => updateNodeData(selectedNode.id, 'label', e.target.value)} disabled={selectedNode.data.isPortalIn} className="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm disabled:opacity-50" />
                    </div>

                    <div className="pt-4 mt-4 border-t border-gray-100">
                      <label className="block text-xs font-semibold text-gray-500 mb-2 uppercase">自訂顏色</label>
                      <div className="flex items-center space-x-3">
                        <input type="color" value={selectedNode.data.color || '#94a3b8'} onChange={(e) => updateNodeData(selectedNode.id, 'color', e.target.value)} className="w-8 h-8 rounded border-0 cursor-pointer bg-transparent" disabled={mode !== 'edit'} />
                        {mode === 'edit' && (
                          <button onClick={() => applyColorToBranch(selectedNode.id, selectedNode.data.color || '#94a3b8')} className="flex-1 px-3 py-1.5 text-xs font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-md transition-colors text-left"><i className="fa-solid fa-sitemap mr-1"></i> 套用至所有分支</button>
                        )}
                      </div>
                    </div>

                    <div className="pt-4 mt-4 border-t border-gray-100">
                      <label className="block text-xs font-semibold text-gray-500 mb-2 uppercase">排版進階選項</label>
                      {selectedNode.data.isPortalIn ? (
                        <p className="text-xs text-purple-600 bg-purple-50 p-2 rounded border border-purple-100"><i className="fa-solid fa-circle-info mr-1"></i> 這是一個傳送門接收端，如需操作請點擊原始節點。</p>
                      ) : (
                        <button onClick={() => togglePortal(selectedNode.id)} className={`w-full px-3 py-2 text-sm font-medium rounded-lg border transition-all ${selectedNode.data.isPortalOut ? 'bg-purple-50 text-purple-700 border-purple-200 hover:bg-purple-100' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'}`}>
                          <i className={`fa-solid ${selectedNode.data.isPortalOut ? 'fa-link-slash' : 'fa-person-through-window'} mr-2`}></i> 
                          {selectedNode.data.isPortalOut ? '關閉傳送門 (接回本體)' : '分離為子區塊 (傳送門)'}
                        </button>
                      )}
                      <p className="text-[10px] text-gray-400 mt-2 leading-relaxed">將擁擠的子節點切斷，獨立放置在畫布其他區域，適合整理過於龐大的樹狀結構。</p>
                    </div>

                  </div>
                </>
              )}
            </aside>

            {toastMessage && (
              <div className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium animate-bounce z-50">
                {toastMessage}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppArchitect />);
  </script>
</body>
</html>
